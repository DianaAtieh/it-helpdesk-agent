<text x="1086" y="152.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a3c5e">1  Interface</text>
<text x="1086" y="178.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b3a39">how does a person use it?  the kit&#x27;s UI starter, or yours</text>
<text x="1086" y="236.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0078d4">2  Entry point</text>
<text x="1086" y="262.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b3a39">how does anyone call it?  FastAPI + the contract</text>
<text x="1086" y="320.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#7a43b6">3  Orchestration</text>
<text x="1086" y="346.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b3a39">who does what, in which order, until when?</text>
<text x="1086" y="404.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#c98a00">4  Tools through MCP</text>
<text x="1086" y="430.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b3a39">how does it act on the client&#x27;s systems?</text>
<text x="1086" y="488.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#00838f">5  Knowledge &amp; memory</text>
<text x="1086" y="514.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b3a39">what does it know and remember?</text>
<text x="1086" y="572.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#c50f1f">6  Guardrails &amp; approvals</text>
<text x="1086" y="598.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b3a39">what must it never do, and who says yes?</text>
<text x="1086" y="656.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2e7d32">7  Evaluation &amp; observability</text>
<text x="1086" y="682.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b3a39">how do we know it works, and why it failed?</text>
<text x="1086" y="740.0" text-anchor="start" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5c5c5c">8  Deployment</text>
