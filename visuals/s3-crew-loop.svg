<path d="M500,640 L1146,640 L1160,654 L1160,716.675 L500,716.675 Z" fill="#fff8c5" stroke="#d4b106" stroke-width="1.5"/><path d="M1146,640 L1146,654 L1160,654" fill="none" stroke="#d4b106" stroke-width="1.5"/><text x="512" y="660.1" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4d4000">The verifier asks the tools, not its memory: open on that weekday? (get_opening_hours) · walk</text><text x="512" y="678.3" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4d4000">under the limit? (travel_time) · a source_url for every fact? · within budget? (code) · instructions</text><text x="512" y="696.6" dominant-baseline="central" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4d4000">hidden in listing text? (flag, ignore)</text>
